spring:
  application:
    name: bookt
  datasource:
    url: jdbc:postgresql://localhost:5432/bookt?options=-c%20timezone=UTC
    username: myuser
    password: secret
  data:
    redis:
      host: localhost
      port: 6379
      password: secret
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  docker:
    compose:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

rate-limit:
  max-requests: 5
  window-seconds: 60